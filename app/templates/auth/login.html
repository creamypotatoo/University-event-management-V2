{% extends 'base.html' %}{% block content %}<div class="card p-4 auth-card"><h1>Log in</h1>{% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="next" value="{{ next_url }}"><div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" maxlength="254" autocomplete="username" required></div><div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" type="password" id="password" name="password" maxlength="128" autocomplete="current-password" required></div><button class="btn btn-primary" type="submit">Log in</button></form></div>{% endblock %}
