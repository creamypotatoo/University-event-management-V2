<form method="get" class="d-flex gap-2 mb-3"><label class="visually-hidden" for="q">Search</label><input class="form-control" id="q" name="q" maxlength="150" placeholder="Search" value="{{ request.args.get('q','') }}"><label class="visually-hidden" for="status">Status</label><select class="form-select" id="status" name="status">{% for s in ['all','registered','attended','cancelled'] %}<option value="{{ s }}" {% if request.args.get('status','all')==s %}selected{% endif %}>{{ s|title }}</option>{% endfor %}</select><button class="btn btn-primary">Filter</button></form>
