<form method="get" class="row g-3 mb-4">{% for name,label in [('from_date','From date'),('to_date','Through date')] %}<div class="col-md-3"><label class="form-label" for="{{ name }}">{{ label }}</label><input class="form-control" id="{{ name }}" name="{{ name }}" type="date" value="{{ request.args.get(name,'') }}"></div>{% endfor %}
{% for name,items,key,label in [('club_id',clubs,'club_id','club_name'),('event_id',events,'event_id','title')] %}<div class="col-md-3"><label class="form-label" for="{{ name }}">{{ name.replace('_id','')|title }}</label><select class="form-select" id="{{ name }}" name="{{ name }}"><option value="">All authorized {{ name.replace('_id','') }}s</option>{% for item in items %}<option value="{{ item[key] }}" {% if request.args.get(name)==item[key]|string %}selected{% endif %}>{{ item[label] }}</option>{% endfor %}</select></div>{% endfor %}<div class="col-12"><button class="btn btn-primary">Apply filters</button> <a href="{{ url_for(request.endpoint) }}">Clear filters</a></div></form>
