{% extends 'base.html' %}{% block content %}<section class="error-panel"><p class="error-code">Request status {{ code }}</p><h1>{{ 'Page not found' if code==404 else 'Access restricted' if code==403 else 'Please try again' if code>=500 else 'Check your request' }}</h1><p role="alert">{{ message }}</p><div class="d-flex gap-3 flex-wrap mt-4"><a class="btn btn-primary" href="{{ url_for('main.index') }}">Return home</a><a class="btn btn-outline-primary" href="{{ url_for('events.index') }}">Browse events</a></div></section>{% endblock %}
